<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blog 22 páginas</title>
<style>
:root{--bg:#f4f1ea;--fg:#1c1b19;--card:#fff;--ac:#b4472b;--mut:#7a766d;--bd:#d9d4c8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--fg:#eee9df;--card:#1d1c1a;--ac:#e0704f;--mut:#9a958a;--bd:#34322e}}
:root[data-theme="dark"]{--bg:#121211;--fg:#eee9df;--card:#1d1c1a;--ac:#e0704f;--mut:#9a958a;--bd:#34322e}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:520px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
#num{font-size:14px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
#items{margin:8px 0 0;padding:0;list-style:none;min-height:150px}
#items li{font-size:26px;padding:8px 0;border-bottom:1px solid var(--bd);word-break:break-word}
#items li:last-child{border:0}
.empty{color:var(--mut);font-size:18px!important}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-areas:". up ." "left . right" ". down .";gap:10px}
.pad button{padding:22px 4px;font-size:15px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-weight:600;line-height:1.3}
.pad button:active,.pad button.k{background:var(--ac);color:#fff}
#fb{text-align:center;font-size:13px;color:var(--mut);min-height:18px;margin-top:8px}
details summary{font-weight:600;cursor:pointer}
input[type=text],select{width:100%;padding:10px;margin:5px 0;font-size:16px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.sm{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px}
label{font-size:14px;color:var(--mut)}
</style></head><body>
<div class="card" id="tap" style="cursor:pointer;min-height:200px"><div id="num">Sin página</div><ul id="items"><li class="empty">Usa el control remoto…</li></ul></div>

<div class="card"><button class="sm" id="act" style="width:100%;margin-bottom:10px;font-weight:600">▶ Activar control remoto (toca aquí primero)</button><div class="pad">
<button id="bU" style="grid-area:up">▲<br>1 página<br>por toque</button>
<button id="bL" style="grid-area:left">◀<br>1 toque: repetir<br>2 toques: reiniciar</button>
<button id="bR" style="grid-area:right">▶<br>+10 páginas</button>
<button id="bD" style="grid-area:down">▼<br>+5 páginas</button>
</div><div id="fb"></div></div>

<div class="card"><details open><summary>✏️ Editar página</summary>
<div class="row" style="margin:10px 0"><button class="sm" id="ep">◀</button><select id="sel"></select><button class="sm" id="en">▶</button></div>
<div id="fields"></div></details></div>

<div class="card"><details open><summary>⚙️ Ajustes y botones</summary>
<label>Pantalla</label><select id="mode"><option value="touch">Mostrar al tocar la pantalla</option><option value="always">Mostrar siempre</option><option value="hide">Oculta (solo audio)</option></select>
<label><input type="checkbox" id="auto" checked> Decir en el auricular el número de página al llegar</label>
<hr><b>Botones del control remoto</b><br><label>Elige qué hace cada botón y toca «Asignar tecla» para que la app aprenda la tecla de tu control.</label>
<div id="cfg"></div><div id="lastkey" style="font-size:13px;color:var(--mut);margin-top:8px">Última tecla detectada: ninguna</div>
</details></div>

<script>
const N=22,S=4;
const DB={U:{act:"multi",id:"ArrowUp"},L:{act:"rl",id:"ArrowLeft"},R:{act:"p10",id:"ArrowRight"},D:{act:"p5",id:"ArrowDown"}};
let D={pages:Array.from({length:N},()=>Array(S).fill("")),auto:true,mode:"touch",btns:JSON.parse(JSON.stringify(DB))};
try{const s=localStorage.getItem("blog22");if(s){const o=JSON.parse(s);if(o&&o.pages&&o.pages.length===N)D=Object.assign(D,o)}}catch(e){}
if(["always","touch","hide"].indexOf(D.mode)<0)D.mode="touch";
if(!D.btns||!D.btns.U||!D.btns.L||!D.btns.R||!D.btns.D)D.btns=JSON.parse(JSON.stringify(DB));
const save=()=>{try{localStorage.setItem("blog22",JSON.stringify(D))}catch(e){}};
let cur=0,ed=1,rev=false;const $=i=>document.getElementById(i);
function render(){
 $("num").textContent=cur?("Página "+cur):"Sin página";
 const ul=$("items");ul.innerHTML="";
 if(!cur){ul.innerHTML='<li class="empty">Usa el control remoto…</li>';return}
 if(D.mode==="hide"||(D.mode==="touch"&&!rev)){ul.innerHTML='<li class="empty">'+(D.mode==="touch"?"Toca la pantalla para ver":"(contenido oculto)")+'</li>';return}
 const it=D.pages[cur-1].filter(x=>x.trim());
 if(!it.length)ul.innerHTML='<li class="empty">Página en blanco</li>';
 it.forEach(t=>{const l=document.createElement("li");l.textContent=t;ul.appendChild(l)});
}
function say(t){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";speechSynthesis.speak(u);
}
function items(){return D.pages[cur-1].filter(x=>x.trim())}
function repeat(){
 if(!cur){say("Sin página");return}
 const it=items();
 say("Página "+cur+". "+(it.length?it.join(". "):"En blanco"));
}
function go(n){cur=n;ed=n;rev=false;render();buildEd();if(D.auto)say("Página "+n)}
function step(k){go(((cur+k-1)%N+N)%N+1)}
function restart(){cur=0;rev=false;if(window.speechSynthesis)speechSynthesis.cancel();render();say("Aplicación reiniciada")}
function fb(t){$("fb").textContent=t}
let tU=0,uT=0,tL=0,lT=0;
function tapUp(){
 tU++;clearTimeout(uT);fb("Toques: "+tU);
 uT=setTimeout(()=>{const c=tU;tU=0;fb("");step(c)},650);
}
function tapLeft(){
 tL++;clearTimeout(lT);fb("Toques: "+tL);
 lT=setTimeout(()=>{const c=tL;tL=0;fb("");if(c>=2)restart();else repeat()},550);
}
function tapRight(){step(10)}
function tapDown(){step(5)}
const SL=["U","L","R","D"],SN={U:"Arriba",L:"Izquierda",R:"Derecha",D:"Abajo"},SI={U:"▲",L:"◀",R:"▶",D:"▼"};
const ACTS={
 multi:["Páginas = nº de toques",tapUp],
 rl:["1 toque repetir / 2 reiniciar",tapLeft],
 p1:["+1 página",()=>step(1)],p5:["+5 páginas",()=>step(5)],p10:["+10 páginas",()=>step(10)],
 b1:["−1 página",()=>step(-1)],b5:["−5 páginas",()=>step(-5)],b10:["−10 páginas",()=>step(-10)],
 rep:["Repetir audio",repeat],res:["Reiniciar",restart]
};
function press(s){const a=ACTS[D.btns[s].act];if(a)a[1]()}
function labels(){SL.forEach(s=>{$("b"+s).innerHTML=SI[s]+"<br>"+ACTS[D.btns[s].act][0]})}
let learn=null;
function buildCfg(){
 const c=$("cfg");c.innerHTML="";
 SL.forEach(s=>{
  const w=document.createElement("div");w.style.marginTop="10px";w.innerHTML="<label>"+SI[s]+" "+SN[s]+"</label>";
  const sel=document.createElement("select");
  Object.keys(ACTS).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=ACTS[k][0];if(k===D.btns[s].act)o.selected=true;sel.appendChild(o)});
  sel.onchange=()=>{D.btns[s].act=sel.value;save();labels();sel.blur()};
  const b=document.createElement("button");b.className="sm";b.style.width="100%";
  b.textContent=learn===s?"Pulsa ahora la tecla del control…":"Asignar tecla (actual: "+D.btns[s].id+")";
  b.onclick=()=>{learn=learn===s?null:s;buildCfg()};
  w.appendChild(sel);w.appendChild(b);c.appendChild(w);
 });
}
const keyId=e=>e.code||e.key||("kc"+e.keyCode);
SL.forEach(s=>{$("b"+s).onclick=()=>press(s)});
document.addEventListener("keydown",e=>{
 const id=keyId(e);
 if(learn){e.preventDefault();D.btns[learn].id=id;save();learn=null;buildCfg();$("lastkey").textContent="Tecla asignada: "+id;return}
 const t=e.target&&e.target.tagName;if((t==="INPUT"&&e.target.type==="text")||t==="TEXTAREA")return;
 $("lastkey").textContent="Última tecla detectada: "+id+((e.key&&e.key!==id)?" ("+e.key+")":"");
 if(e.repeat)return;
 for(const s of SL)if(D.btns[s].id===id){e.preventDefault();press(s);return}
});
function buildEd(){
 const sel=$("sel");
 if(!sel.options.length)for(let i=1;i<=N;i++){const o=document.createElement("option");o.value=i;o.textContent="Página "+i;sel.appendChild(o)}
 sel.value=ed;$("fields").innerHTML="";
 for(let j=0;j<S;j++){
  const i=document.createElement("input");i.type="text";i.placeholder="Cosa "+(j+1);i.value=D.pages[ed-1][j];
  i.oninput=()=>{D.pages[ed-1][j]=i.value;save();if(cur===ed)render()};
  $("fields").appendChild(i);
 }
}
$("sel").onchange=e=>{ed=+e.target.value;buildEd();e.target.blur()};
$("ep").onclick=()=>{ed=ed>1?ed-1:N;buildEd()};
$("en").onclick=()=>{ed=ed<N?ed+1:1;buildEd()};
$("auto").checked=D.auto;$("mode").value=D.mode;
$("auto").onchange=e=>{D.auto=e.target.checked;save()};
$("mode").onchange=e=>{D.mode=e.target.value;rev=false;save();render();e.target.blur()};
$("tap").onclick=()=>{if(D.mode==="touch"&&cur){rev=!rev;render()}};
function mediaKey(name){
 const id="media:"+name;
 if(learn){D.btns[learn].id=id;save();learn=null;buildCfg();$("lastkey").textContent="Tecla asignada: "+id;return}
 $("lastkey").textContent="Última tecla detectada: "+id;
 for(const s of SL)if(D.btns[s].id===id){press(s);return}
}
function silentWav(){const sr=8000,n=sr;const b=new Uint8Array(44+n);const dv=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i)};w(0,"RIFF");dv.setUint32(4,36+n,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,"data");dv.setUint32(40,n,true);b.fill(128,44);let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return "data:audio/wav;base64,"+btoa(s)}
let aud=null;
function activate(){
 try{
  if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}
  if(!aud){aud=new Audio(silentWav());aud.loop=true}
  const p=aud.play();if(p&&p.catch)p.catch(()=>{});
  if("mediaSession" in navigator){
   navigator.mediaSession.metadata=new MediaMetadata({title:"Blog 22 páginas"});
   navigator.mediaSession.playbackState="playing";
   ["play","pause","previoustrack","nexttrack","seekbackward","seekforward","stop"].forEach(a=>{try{navigator.mediaSession.setActionHandler(a,()=>{mediaKey(a);if(aud&&aud.paused)aud.play().catch(()=>{});navigator.mediaSession.playbackState="playing"})}catch(e){}});
  }
  $("act").textContent="✅ Control remoto activo (toca para reactivar)";
 }catch(e){$("act").textContent="No se pudo activar, intenta de nuevo"}
}
$("act").onclick=activate;
buildEd();render();labels();buildCfg();
</script></body></html>
